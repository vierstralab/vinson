model_type: regression
model_kwargs:
  log_output: false
hparams:
  batch_size: 32
  lr_scheduler: OneCycleLR
  lr_scheduler_kwargs:
    max_lr: 5.0e-05
    final_div_factor: 1e4
    div_fct: 25
data_params:
  clip_density: 20
  min_bg: 0.1
  negatives_weight: 1
logging_params:
  val_check_interval: 0.5
  logger_type: csv