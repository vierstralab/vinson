model_type: basset_embed
model_arch:
  cell_embed:
    n_inputs: 637
    hidden_dims: [256, 256]
    batch_norm: true
    batch_norm_momentum: 0.1
    activation: silu
  
  head:
    n_inputs: 256
    hidden_dims: [128, 64]
    batch_norm: true
    batch_norm_momentum: 0.1
    activation: silu

model_kwargs:
  log_output: false

train_augmentation_kwargs:
  reverse_complement: true
  jitter: 5
  noise: 0.01
validation_augmentation_kwargs:
  reverse_complement: false
  jitter: 0
  noise: 0
hparams:
  batch_size: 64
  optimizer_kwargs:
    lr: 1.0e-05
data_params:
  clip_density: 20
  min_bg: 0.1
  negatives_weight: 1
logging_params:
  val_check_interval: 0.2
  logger_type: csv